IFU_DISTORTION_RAW:
  do.catg: IFU_DISTORTION_RAW
  mode: "wcu_lms"
  source:
    name: empty_sky
    kwargs: {}
  properties:
    dit: 10
    ndit: 20
    wavelen: 3.555
    filter_name: "open"
    nd_filter_name: "open"
    catg: "CALIB"
    tech: "IFU"
    type: "DISTORTION"
    tplname: "METIS_ifu_cal_distortion"
    nObs: 3
  wcu:
    current_lamp: "bb"
    # grid_lm is the LMS astrometric calibration mask (~100 apertures); with the
    # blackbody open at 800 K this is the same illumination as rsrfPinhIFU.yaml,
    # which traces the full complement of IFU slices.
    current_fpmask: "grid_lm"
    bb_aperture: 0.5
    bb_temp: 800
    is_temp: 300
    wcu_temp: 300
    xshift: 0
    # As in rsrfPinhIFU.yaml: without this offset the grid straddles the slices and
    # the clusters fragment below min_cluster (82 traces instead of 119).
    yshift: -0.1
    