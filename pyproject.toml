[project]
name = "metis_simulations"
dynamic = ["version"]
description = "METIS Simulations for ESO"
license = "GPL-3.0-or-later"
authors = [
{name = "Jennifer Karr", email="jkarr@asiaa.sinica.edu.tw"}
]
maintainers = [
{name = "Jennifer Karr", email = "jkarr@asiaa.sinica.edu.tw"},
{name = "Hugo Buddelmeijer", email = "hugo@buddelmeijer.nl"},
{name = "Fabian Haberhauer", email = "fabian.haberhauer@univie.ac.at"},
]
readme = "README.md"
repository = "https://github.com/AstarVienna/METIS_Simulations"
documentation = "https://scopesim.readthedocs.io/en/latest/"
requires-python = ">=3.12,<3.15"
dependencies = [
    "scopesim",
    "scopesim_templates",
]

[project.scripts]
metis-simulate = "metis_simulations.__main__:main"

[tool.poetry]
# Placeholder required by Poetry; replaced from Git tags during builds.
packages = [{include = "metis_simulations"}]
exclude = ["**/__pycache__", "**/*.pyc", "**/*~"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = {version = ">=1.0.0,<2.0.0", extras = ["plugin"]}

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
# Support both vYYYY.MM.DD and vYYYYMMDD release tags.
pattern = '^v(?P<base>\d+(?:\.\d+)*)$'
strict = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
